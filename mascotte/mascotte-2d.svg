<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dégradés pour donner de la profondeur -->
    <linearGradient id="potGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8DCC4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D8C8B8;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="soilGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B7355;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B5345;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="faceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFEF8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5F1E8;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="leafGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#9FB09E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7A9B7A;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Fond transparent -->
  
  <!-- Pot de fleur -->
  <g transform="translate(200, 320)">
    <!-- Ombre du pot -->
    <ellipse cx="0" cy="60" rx="75" ry="12" fill="#000000" opacity="0.1"/>
    
    <!-- Corps du pot -->
    <path d="M -55 0 L -50 50 Q -45 55 0 55 Q 45 55 50 50 L 55 0 Q 50 -5 0 -5 Q -50 -5 -55 0 Z" 
          fill="url(#potGradient)" 
          stroke="#C8B8A8" 
          stroke-width="2"/>
    
    <!-- Bordure du pot -->
    <ellipse cx="0" cy="0" rx="58" ry="10" fill="#F0E8D8" stroke="#D8C8B8" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="55" ry="8" fill="url(#potGradient)"/>
    
    <!-- Terre -->
    <ellipse cx="0" cy="0" rx="52" ry="7" fill="url(#soilGradient)"/>
    
    <!-- Petites pierres décoratives sur la terre -->
    <circle cx="-25" cy="2" r="3" fill="#A89888" opacity="0.6"/>
    <circle cx="20" cy="1" r="2.5" fill="#B8A898" opacity="0.6"/>
    <circle cx="-8" cy="3" r="2" fill="#A89888" opacity="0.6"/>
  </g>
  
  <!-- Tige principale -->
  <g transform="translate(200, 320)">
    <path d="M 0 -5 Q -3 -40 0 -80 Q 2 -100 0 -120" 
          stroke="#5A6C57" 
          stroke-width="10" 
          fill="none" 
          stroke-linecap="round"/>
    
    <!-- Reflets sur la tige -->
    <path d="M -2 -10 Q -4 -40 -2 -70" 
          stroke="#7A9B7A" 
          stroke-width="2" 
          fill="none" 
          opacity="0.5"/>
  </g>
  
  <!-- Feuilles (style enfantin et joyeux) -->
  <!-- Feuille gauche 1 -->
  <g transform="translate(160, 240)">
    <ellipse cx="0" cy="0" rx="30" ry="18" 
             fill="url(#leafGradient)" 
             stroke="#5A6C57" 
             stroke-width="2"
             transform="rotate(-35)"/>
    <!-- Nervure centrale -->
    <line x1="-20" y1="-8" x2="18" y2="6" 
          stroke="#5A6C57" 
          stroke-width="1.5" 
          opacity="0.5"/>
  </g>
  
  <!-- Feuille droite 1 -->
  <g transform="translate(240, 235)">
    <ellipse cx="0" cy="0" rx="30" ry="18" 
             fill="url(#leafGradient)" 
             stroke="#5A6C57" 
             stroke-width="2"
             transform="rotate(35)"/>
    <line x1="-18" y1="6" x2="20" y2="-8" 
          stroke="#5A6C57" 
          stroke-width="1.5" 
          opacity="0.5"/>
  </g>
  
  <!-- Feuille gauche 2 (plus haute) -->
  <g transform="translate(170, 180)">
    <ellipse cx="0" cy="0" rx="28" ry="16" 
             fill="url(#leafGradient)" 
             stroke="#5A6C57" 
             stroke-width="2"
             transform="rotate(-40)"/>
    <line x1="-18" y1="-7" x2="16" y2="5" 
          stroke="#5A6C57" 
          stroke-width="1.5" 
          opacity="0.5"/>
  </g>
  
  <!-- Feuille droite 2 (plus haute) -->
  <g transform="translate(230, 175)">
    <ellipse cx="0" cy="0" rx="28" ry="16" 
             fill="url(#leafGradient)" 
             stroke="#5A6C57" 
             stroke-width="2"
             transform="rotate(40)"/>
    <line x1="-16" y1="5" x2="18" y2="-7" 
          stroke="#5A6C57" 
          stroke-width="1.5" 
          opacity="0.5"/>
  </g>
  
  <!-- Feuille du haut -->
  <g transform="translate(200, 130)">
    <ellipse cx="0" cy="0" rx="25" ry="14" 
             fill="url(#leafGradient)" 
             stroke="#5A6C57" 
             stroke-width="2"
             transform="rotate(-5)"/>
    <line x1="-15" y1="-2" x2="15" y2="2" 
          stroke="#5A6C57" 
          stroke-width="1.5" 
          opacity="0.5"/>
  </g>
  
  <!-- Visage de la plante -->
  <g transform="translate(200, 200)" id="mascotte-face">
    <!-- Tête (cercle doux) -->
    <circle cx="0" cy="0" r="45" 
            fill="url(#faceGlow)" 
            stroke="#E8DCC4" 
            stroke-width="3"/>
    
    <!-- Joues roses (aspect mignon) -->
    <circle cx="-25" cy="8" r="12" fill="#F5C8C0" opacity="0.5"/>
    <circle cx="25" cy="8" r="12" fill="#F5C8C0" opacity="0.5"/>
    
    <!-- Yeux -->
    <!-- Blanc des yeux -->
    <circle cx="-15" cy="-8" r="10" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="2" id="left-eye-white"/>
    <circle cx="15" cy="-8" r="10" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="2" id="right-eye-white"/>
    
    <!-- Pupilles (qui peuvent bouger) -->
    <circle cx="-15" cy="-8" r="5" fill="#3A3A3A" id="left-pupil"/>
    <circle cx="15" cy="-8" r="5" fill="#3A3A3A" id="right-pupil"/>
    
    <!-- Reflets dans les yeux (pour plus de vie) -->
    <circle cx="-13" cy="-11" r="2.5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="17" cy="-11" r="2.5" fill="#FFFFFF" opacity="0.8"/>
    
    <!-- Sourcils joyeux -->
    <path d="M -25 -18 Q -15 -21 -5 -18" 
          stroke="#5A6C57" 
          stroke-width="2.5" 
          fill="none" 
          stroke-linecap="round"/>
    <path d="M 5 -18 Q 15 -21 25 -18" 
          stroke="#5A6C57" 
          stroke-width="2.5" 
          fill="none" 
          stroke-linecap="round"/>
    
    <!-- Sourire chaleureux -->
    <path d="M -22 12 Q 0 22 22 12" 
          stroke="#E8C5C0" 
          stroke-width="3" 
          fill="none" 
          stroke-linecap="round"/>
    
    <!-- Langue mignonne (optionnel, ajoute du caractère) -->
    <ellipse cx="0" cy="18" rx="8" ry="5" fill="#F5A8A8" opacity="0.7"/>
  </g>
  
  <!-- Petite fleur sur la tête (détail kawaii) -->
  <g transform="translate(220, 155)">
    <!-- Pétales -->
    <circle cx="0" cy="-8" r="4" fill="#F5D5DD"/>
    <circle cx="-7" cy="-4" r="4" fill="#F5D5DD"/>
    <circle cx="7" cy="-4" r="4" fill="#F5D5DD"/>
    <circle cx="-4" cy="3" r="4" fill="#F5D5DD"/>
    <circle cx="4" cy="3" r="4" fill="#F5D5DD"/>
    <!-- Centre -->
    <circle cx="0" cy="-2" r="3" fill="#F8E870"/>
  </g>
  
  <!-- Particules magiques autour (ajoute de la vie) -->
  <g opacity="0.6">
    <circle cx="130" cy="210" r="3" fill="#E8C5C0">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="210;205;210" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="270" cy="195" r="2.5" fill="#8FA08E">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="195;190;195" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="150" cy="160" r="2" fill="#F5D5DD">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="160;155;160" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="255" cy="170" r="2.5" fill="#E8C5C0">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="170;165;170" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
