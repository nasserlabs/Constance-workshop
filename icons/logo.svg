<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Cercle extérieur décoratif -->
  <circle cx="100" cy="100" r="85" stroke="#8FA08E" stroke-width="2" fill="none" opacity="0.3"/>
  
  <!-- Feuilles stylisées formant une couronne -->
  <path d="M100 30 Q120 50 100 70 Q80 50 100 30" fill="#8FA08E"/>
  <path d="M130 45 Q140 70 120 85 Q110 65 130 45" fill="#8FA08E" opacity="0.8"/>
  <path d="M70 45 Q60 70 80 85 Q90 65 70 45" fill="#8FA08E" opacity="0.8"/>
  
  <!-- Tige centrale -->
  <rect x="97" y="70" width="6" height="60" rx="3" fill="#5A6C57"/>
  
  <!-- Fleur centrale - pétales -->
  <circle cx="100" cy="100" r="25" fill="#E8C5C0" opacity="0.6"/>
  <ellipse cx="100" cy="75" rx="12" ry="20" fill="#E8C5C0"/>
  <ellipse cx="100" cy="125" rx="12" ry="20" fill="#E8C5C0"/>
  <ellipse cx="75" cy="100" rx="20" ry="12" fill="#E8C5C0"/>
  <ellipse cx="125" cy="100" rx="20" ry="12" fill="#E8C5C0"/>
  
  <!-- Centre de la fleur -->
  <circle cx="100" cy="100" r="12" fill="#F5F1E8"/>
  <circle cx="100" cy="100" r="8" fill="#8FA08E"/>
  
  <!-- Feuilles du bas -->
  <path d="M90 130 Q70 140 75 155 Q85 145 90 130" fill="#8FA08E" opacity="0.7"/>
  <path d="M110 130 Q130 140 125 155 Q115 145 110 130" fill="#8FA08E" opacity="0.7"/>
  
  <!-- Détails décoratifs - petits points -->
  <circle cx="100" cy="100" r="2" fill="#5A6C57" opacity="0.5">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 100 100"
      to="360 100 100"
      dur="20s"
      repeatCount="indefinite"/>
  </circle>
</svg>
