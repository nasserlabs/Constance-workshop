<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond dégradé rose doux -->
  <defs>
    <linearGradient id="roseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF5F7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFE8ED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5DDE3;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="peonyGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#F5D5DD;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8C5C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D8B5B0;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="creamGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFBF5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F5F1E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8DCC4;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <rect width="800" height="600" fill="url(#roseGradient)"/>
  
  <!-- Cercles décoratifs -->
  <circle cx="130" cy="110" r="65" fill="#E8C5C0" opacity="0.12"/>
  <circle cx="670" cy="490" r="85" fill="#E8C5C0" opacity="0.1"/>
  
  <!-- Composition centrale -->
  <g transform="translate(400, 310)">
    <!-- Tiges -->
    <line x1="-40" y1="30" x2="-50" y2="-85" stroke="#8FA08E" stroke-width="4" opacity="0.6"/>
    <line x1="0" y1="35" x2="0" y2="-100" stroke="#8FA08E" stroke-width="5" opacity="0.6"/>
    <line x1="40" y1="30" x2="48" y2="-80" stroke="#8FA08E" stroke-width="4" opacity="0.6"/>
    <line x1="-20" y1="32" x2="-25" y2="-70" stroke="#8FA08E" stroke-width="3.5" opacity="0.6"/>
    <line x1="20" y1="32" x2="25" y2="-75" stroke="#8FA08E" stroke-width="3.5" opacity="0.6"/>
    
    <!-- Feuillage doré -->
    <ellipse cx="-45" cy="-50" rx="12" ry="22" fill="#D4AF37" opacity="0.4" transform="rotate(-25 -45 -50)"/>
    <ellipse cx="50" cy="-45" rx="13" ry="24" fill="#D4AF37" opacity="0.4" transform="rotate(25 50 -45)"/>
    <ellipse cx="-30" cy="-35" rx="10" ry="18" fill="#D4AF37" opacity="0.35" transform="rotate(-15 -30 -35)"/>
    <ellipse cx="30" cy="-40" rx="11" ry="20" fill="#D4AF37" opacity="0.35" transform="rotate(15 30 -40)"/>
    
    <!-- Pivoines roses -->
    <!-- Pivoine 1 (gauche) -->
    <g transform="translate(-50, -85)">
      <circle r="28" fill="url(#peonyGradient)"/>
      <!-- Pétales externes -->
      <ellipse cx="-15" cy="0" rx="18" ry="12" fill="#E8C5C0" opacity="0.9" transform="rotate(-30 -15 0)"/>
      <ellipse cx="15" cy="0" rx="18" ry="12" fill="#E8C5C0" opacity="0.9" transform="rotate(30 15 0)"/>
      <ellipse cx="0" cy="-15" rx="12" ry="18" fill="#E8C5C0" opacity="0.9"/>
      <ellipse cx="0" cy="15" rx="12" ry="18" fill="#E8C5C0" opacity="0.9"/>
      <!-- Pétales internes -->
      <circle r="20" fill="#F5D5DD" opacity="0.95"/>
      <circle r="14" fill="#E8C5C0" opacity="0.9"/>
      <circle r="8" fill="#D8B5B0"/>
    </g>
    
    <!-- Pivoine 2 (centre) - la plus grande -->
    <g transform="translate(0, -100)">
      <circle r="32" fill="url(#peonyGradient)"/>
      <!-- Pétales externes -->
      <ellipse cx="-18" cy="0" rx="20" ry="14" fill="#E8C5C0" opacity="0.9" transform="rotate(-30 -18 0)"/>
      <ellipse cx="18" cy="0" rx="20" ry="14" fill="#E8C5C0" opacity="0.9" transform="rotate(30 18 0)"/>
      <ellipse cx="0" cy="-18" rx="14" ry="20" fill="#E8C5C0" opacity="0.9"/>
      <ellipse cx="0" cy="18" rx="14" ry="20" fill="#E8C5C0" opacity="0.9"/>
      <!-- Pétales intermédiaires -->
      <ellipse cx="-12" cy="-12" rx="16" ry="12" fill="#F5D5DD" opacity="0.95" transform="rotate(-45 -12 -12)"/>
      <ellipse cx="12" cy="-12" rx="16" ry="12" fill="#F5D5DD" opacity="0.95" transform="rotate(45 12 -12)"/>
      <!-- Centre -->
      <circle r="16" fill="#E8C5C0" opacity="0.95"/>
      <circle r="10" fill="#D8B5B0"/>
    </g>
    
    <!-- Pivoine 3 (droite) -->
    <g transform="translate(48, -80)">
      <circle r="26" fill="url(#peonyGradient)"/>
      <ellipse cx="-14" cy="0" rx="17" ry="11" fill="#E8C5C0" opacity="0.9" transform="rotate(-30 -14 0)"/>
      <ellipse cx="14" cy="0" rx="17" ry="11" fill="#E8C5C0" opacity="0.9" transform="rotate(30 14 0)"/>
      <ellipse cx="0" cy="-14" rx="11" ry="17" fill="#E8C5C0" opacity="0.9"/>
      <ellipse cx="0" cy="14" rx="11" ry="17" fill="#E8C5C0" opacity="0.9"/>
      <circle r="18" fill="#F5D5DD" opacity="0.95"/>
      <circle r="12" fill="#E8C5C0" opacity="0.9"/>
      <circle r="7" fill="#D8B5B0"/>
    </g>
    
    <!-- Ranunculus crème -->
    <!-- Ranunculus 1 -->
    <g transform="translate(-25, -70)">
      <circle r="18" fill="url(#creamGradient)"/>
      <circle r="15" fill="#FFFBF5" opacity="0.95"/>
      <circle r="12" fill="#F5F1E8" opacity="0.9"/>
      <circle r="9" fill="#E8DCC4" opacity="0.9"/>
      <circle r="5" fill="#D8C5A8"/>
    </g>
    
    <!-- Ranunculus 2 -->
    <g transform="translate(25, -75)">
      <circle r="16" fill="url(#creamGradient)"/>
      <circle r="13" fill="#FFFBF5" opacity="0.95"/>
      <circle r="10" fill="#F5F1E8" opacity="0.9"/>
      <circle r="7" fill="#E8DCC4" opacity="0.9"/>
      <circle r="4" fill="#D8C5A8"/>
    </g>
    
    <!-- Petites fleurs d'accompagnement -->
    <circle cx="-60" cy="-50" r="8" fill="#F5D5DD" opacity="0.7"/>
    <circle cx="55" cy="-55" r="7" fill="#F5D5DD" opacity="0.7"/>
    <circle cx="-35" cy="-45" r="6" fill="#FFFBF5" opacity="0.8"/>
  </g>
  
  <!-- Pétales décoratifs tombants -->
  <ellipse cx="200" cy="480" rx="8" ry="12" fill="#E8C5C0" opacity="0.3" transform="rotate(-45 200 480)"/>
  <ellipse cx="600" cy="150" rx="7" ry="11" fill="#E8C5C0" opacity="0.25" transform="rotate(30 600 150)"/>
</svg>
