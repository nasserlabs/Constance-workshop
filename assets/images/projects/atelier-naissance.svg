<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond atelier chaleureux -->
  <defs>
    <linearGradient id="atelierGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAF8F5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F0EBE3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8DDD0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFEF8;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#F8F5E8;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="600" fill="url(#atelierGradient)"/>
  
  <!-- Fenêtre lumineuse (à gauche) -->
  <g transform="translate(150, 120)">
    <rect x="0" y="0" width="140" height="200" fill="url(#windowLight)" stroke="#D8C8B8" stroke-width="8"/>
    <line x1="70" y1="0" x2="70" y2="200" stroke="#D8C8B8" stroke-width="6"/>
    <line x1="0" y1="100" x2="140" y2="100" stroke="#D8C8B8" stroke-width="6"/>
    
    <!-- Lumière qui entre -->
    <rect x="150" y="20" width="100" height="40" fill="#FFFEF8" opacity="0.2"/>
    <rect x="150" y="80" width="80" height="50" fill="#FFFEF8" opacity="0.15"/>
  </g>
  
  <!-- Table de travail -->
  <g transform="translate(400, 420)">
    <!-- Plateau de table -->
    <rect x="-200" y="-20" width="400" height="30" fill="#B8A898" opacity="0.6"/>
    <rect x="-200" y="10" width="400" height="8" fill="#A89888" opacity="0.5"/>
    
    <!-- Pieds de table -->
    <rect x="-180" y="10" width="15" height="80" fill="#A89888" opacity="0.5"/>
    <rect x="165" y="10" width="15" height="80" fill="#A89888" opacity="0.5"/>
    
    <!-- Outils sur la table -->
    <!-- Ciseaux -->
    <g transform="translate(-120, -5)">
      <ellipse cx="0" cy="0" rx="8" ry="3" fill="#888888" transform="rotate(30 0 0)"/>
      <ellipse cx="8" cy="5" rx="8" ry="3" fill="#888888" transform="rotate(30 8 5)"/>
      <rect x="-2" y="-10" width="3" height="15" fill="#989898" transform="rotate(30 -2 -10)"/>
      <rect x="6" y="-5" width="3" height="15" fill="#989898" transform="rotate(30 6 -5)"/>
    </g>
    
    <!-- Vase avec fleurs en préparation -->
    <g transform="translate(50, -40)">
      <ellipse cx="0" cy="30" rx="20" ry="8" fill="#C8B8A8" opacity="0.7"/>
      <rect x="-18" y="15" width="36" height="20" fill="#D8C8B8" opacity="0.7" rx="2"/>
      <!-- Fleurs dans le vase -->
      <line x1="-10" y1="15" x2="-15" y2="-20" stroke="#8FA08E" stroke-width="2" opacity="0.6"/>
      <line x1="0" y1="15" x2="0" y2="-25" stroke="#8FA08E" stroke-width="2" opacity="0.6"/>
      <line x1="10" y1="15" x2="12" y2="-18" stroke="#8FA08E" stroke-width="2" opacity="0.6"/>
      <circle cx="-15" cy="-22" r="6" fill="#E8C5C0" opacity="0.8"/>
      <circle cx="0" cy="-27" r="7" fill="#F5D5DD" opacity="0.8"/>
      <circle cx="12" cy="-20" r="6" fill="#E8C5C0" opacity="0.8"/>
    </g>
    
    <!-- Bobine de ruban -->
    <g transform="translate(-60, -5)">
      <ellipse cx="0" cy="0" rx="12" ry="8" fill="#E8C5C0" opacity="0.6"/>
      <ellipse cx="0" cy="0" rx="8" ry="5" fill="#F5D5DD" opacity="0.7"/>
      <path d="M 12 0 Q 25 -5 30 -3" stroke="#E8C5C0" stroke-width="3" fill="none" opacity="0.5"/>
    </g>
    
    <!-- Livre ou cahier ouvert -->
    <g transform="translate(120, -8)">
      <rect x="-30" y="0" width="30" height="20" fill="#F5F1E8" opacity="0.7" rx="1"/>
      <rect x="0" y="0" width="30" height="20" fill="#FEFDFB" opacity="0.7" rx="1"/>
      <line x1="-25" y1="5" x2="-8" y2="5" stroke="#D8C8B8" stroke-width="0.8" opacity="0.4"/>
      <line x1="-25" y1="9" x2="-8" y2="9" stroke="#D8C8B8" stroke-width="0.8" opacity="0.4"/>
      <line x1="-25" y1="13" x2="-15" y2="13" stroke="#D8C8B8" stroke-width="0.8" opacity="0.4"/>
    </g>
  </g>
  
  <!-- Étagère murale avec plantes -->
  <g transform="translate(550, 200)">
    <rect x="0" y="0" width="180" height="12" fill="#B8A898" opacity="0.5"/>
    <rect x="0" y="12" width="180" height="4" fill="#A89888" opacity="0.4"/>
    
    <!-- Petites plantes sur l'étagère -->
    <!-- Pot 1 -->
    <g transform="translate(30, -15)">
      <rect x="-12" y="10" width="24" height="18" fill="#C8B8A8" opacity="0.6" rx="2"/>
      <ellipse cx="0" cy="10" rx="13" ry="5" fill="#D8C8B8" opacity="0.6"/>
      <line x1="-5" y1="10" x2="-8" y2="-10" stroke="#6B8B6B" stroke-width="2" opacity="0.7"/>
      <line x1="5" y1="10" x2="7" y2="-12" stroke="#6B8B6B" stroke-width="2" opacity="0.7"/>
      <ellipse cx="-8" cy="-12" rx="6" ry="10" fill="#8FA08E" opacity="0.7" transform="rotate(-20 -8 -12)"/>
      <ellipse cx="7" cy="-14" rx="6" ry="10" fill="#8FA08E" opacity="0.7" transform="rotate(20 7 -14)"/>
    </g>
    
    <!-- Pot 2 -->
    <g transform="translate(90, -12)">
      <ellipse cx="0" cy="12" rx="15" ry="6" fill="#B8A898" opacity="0.6"/>
      <rect x="-14" y="6" width="28" height="12" fill="#C8B8A8" opacity="0.6" rx="2"/>
      <circle cx="0" cy="0" r="8" fill="#7A9B7A" opacity="0.7"/>
      <circle cx="-6" cy="2" r="6" fill="#8FA08E" opacity="0.7"/>
      <circle cx="6" cy="3" r="5" fill="#8FA08E" opacity="0.7"/>
    </g>
    
    <!-- Pot 3 -->
    <g transform="translate(150, -18)">
      <rect x="-10" y="12" width="20" height="16" fill="#C8B8A8" opacity="0.6" rx="2"/>
      <ellipse cx="0" cy="12" rx="11" ry="5" fill="#D8C8B8" opacity="0.6"/>
      <line x1="0" y1="12" x2="0" y2="-8" stroke="#6B8B6B" stroke-width="2" opacity="0.7"/>
      <circle cx="0" cy="-10" r="5" fill="#E8C5C0" opacity="0.7"/>
      <ellipse cx="-4" cy="-6" rx="4" ry="6" fill="#F5D5DD" opacity="0.7"/>
      <ellipse cx="4" cy="-6" rx="4" ry="6" fill="#F5D5DD" opacity="0.7"/>
    </g>
  </g>
  
  <!-- Bouquets séchants suspendus -->
  <g transform="translate(650, 80)">
    <!-- Ficelle -->
    <line x1="0" y1="0" x2="0" y2="80" stroke="#A89888" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="80" x2="-15" y2="100" stroke="#A89888" stroke-width="1.5" opacity="0.4"/>
    
    <!-- Bouquet suspendu -->
    <g transform="translate(-15, 100)">
      <line x1="0" y1="0" x2="-3" y2="25" stroke="#8B9B7A" stroke-width="2" opacity="0.5"/>
      <line x1="0" y1="0" x2="2" y2="23" stroke="#8B9B7A" stroke-width="2" opacity="0.5"/>
      <line x1="0" y1="0" x2="0" y2="27" stroke="#8B9B7A" stroke-width="2" opacity="0.5"/>
      <circle cx="-3" cy="27" r="4" fill="#D8B8A8" opacity="0.6"/>
      <circle cx="2" cy="25" r="3.5" fill="#D8B8A8" opacity="0.6"/>
      <circle cx="0" cy="29" r="4" fill="#C8A898" opacity="0.6"/>
      <ellipse cx="-5" cy="22" rx="3" ry="6" fill="#9BAB8A" opacity="0.5" transform="rotate(-25 -5 22)"/>
      <ellipse cx="4" cy="20" rx="3" ry="6" fill="#9BAB8A" opacity="0.5" transform="rotate(25 4 20)"/>
    </g>
  </g>
  
  <!-- Panier au sol avec matériel -->
  <g transform="translate(200, 480)">
    <ellipse cx="0" cy="20" rx="40" ry="15" fill="#B8A898" opacity="0.5"/>
    <path d="M -40 20 Q -45 0 -35 -10 L 35 -10 Q 45 0 40 20 Z" fill="#C8B8A8" opacity="0.5"/>
    
    <!-- Tiges et fleurs dans le panier -->
    <line x1="-20" y1="5" x2="-25" y2="-20" stroke="#8FA08E" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="5" x2="0" y2="-25" stroke="#8FA08E" stroke-width="2" opacity="0.6"/>
    <line x1="20" y1="5" x2="22" y2="-18" stroke="#8FA08E" stroke-width="2" opacity="0.6"/>
    <circle cx="-25" cy="-22" r="5" fill="#E8C5C0" opacity="0.7"/>
    <circle cx="0" cy="-27" r="6" fill="#F5D5DD" opacity="0.7"/>
    <circle cx="22" cy="-20" r="5" fill="#E8C5C0" opacity="0.7"/>
  </g>
  
  <!-- Ambiance chaleureuse avec particules -->
  <circle cx="320" cy="180" r="2" fill="#F8F5E8" opacity="0.4"/>
  <circle cx="480" cy="250" r="2.5" fill="#F8F5E8" opacity="0.35"/>
  <circle cx="580" cy="320" r="2" fill="#F8F5E8" opacity="0.4"/>
  <circle cx="280" cy="380" r="2" fill="#F8F5E8" opacity="0.3"/>
</svg>
