<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond dégradé sombre et luxueux -->
  <defs>
    <linearGradient id="opulenceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2A1A2A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3A2A3A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A3A4A;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="orchidGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#9A6AA8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7A4A88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5A2A68;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="callaGradient" cx="50%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#3A2A3A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2A1A2A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A0A1A;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <rect width="800" height="600" fill="url(#opulenceGradient)"/>
  
  <!-- Cercles décoratifs dorés -->
  <circle cx="120" cy="100" r="60" fill="#9A7A5A" opacity="0.1"/>
  <circle cx="680" cy="500" r="80" fill="#8A6A4A" opacity="0.08"/>
  
  <!-- Composition centrale dramatique -->
  <g transform="translate(400, 320)">
    <!-- Tiges sombres -->
    <line x1="-45" y1="25" x2="-55" y2="-95" stroke="#4A3A4A" stroke-width="4.5" opacity="0.8"/>
    <line x1="0" y1="28" x2="0" y2="-110" stroke="#4A3A4A" stroke-width="5" opacity="0.8"/>
    <line x1="45" y1="25" x2="52" y2="-90" stroke="#4A3A4A" stroke-width="4.5" opacity="0.8"/>
    <line x1="-25" y1="26" x2="-30" y2="-75" stroke="#4A3A4A" stroke-width="4" opacity="0.8"/>
    <line x1="25" y1="26" x2="28" y2="-80" stroke="#4A3A4A" stroke-width="4" opacity="0.8"/>
    
    <!-- Amarantes retombantes (cascades pourpres) -->
    <g transform="translate(-60, -60)">
      <path d="M 0 0 Q -5 15 -3 30 Q -6 45 -8 60" 
            stroke="#7A4A88" stroke-width="4" fill="none" opacity="0.8"/>
      <!-- Perles d'amarante -->
      <circle cx="-2" cy="8" r="3" fill="#9A6AA8" opacity="0.9"/>
      <circle cx="-4" cy="16" r="3.2" fill="#9A6AA8" opacity="0.9"/>
      <circle cx="-3" cy="24" r="3" fill="#8A5A98" opacity="0.9"/>
      <circle cx="-5" cy="32" r="3.3" fill="#8A5A98" opacity="0.9"/>
      <circle cx="-5.5" cy="40" r="3.1" fill="#7A4A88" opacity="0.9"/>
      <circle cx="-6.5" cy="48" r="3" fill="#7A4A88" opacity="0.9"/>
      <circle cx="-7" cy="56" r="2.8" fill="#6A3A78" opacity="0.9"/>
    </g>
    
    <g transform="translate(58, -55)">
      <path d="M 0 0 Q 4 18 2 35 Q 5 48 7 62" 
            stroke="#7A4A88" stroke-width="4" fill="none" opacity="0.8"/>
      <circle cx="2" cy="10" r="3" fill="#9A6AA8" opacity="0.9"/>
      <circle cx="3" cy="18" r="3.2" fill="#9A6AA8" opacity="0.9"/>
      <circle cx="2" cy="26" r="3" fill="#8A5A98" opacity="0.9"/>
      <circle cx="4" cy="34" r="3.3" fill="#8A5A98" opacity="0.9"/>
      <circle cx="4.5" cy="42" r="3.1" fill="#7A4A88" opacity="0.9"/>
      <circle cx="5.5" cy="50" r="3" fill="#7A4A88" opacity="0.9"/>
      <circle cx="6" cy="58" r="2.8" fill="#6A3A78" opacity="0.9"/>
    </g>
    
    <!-- Callas noirs (fleurs élégantes) -->
    <!-- Calla 1 -->
    <g transform="translate(-30, -75)">
      <path d="M 0 0 Q -12 -8 -15 -25 Q -10 -35 0 -38 Q 10 -35 15 -25 Q 12 -8 0 0 Z" 
            fill="url(#callaGradient)" opacity="0.95"/>
      <ellipse cx="0" cy="-20" rx="3" ry="8" fill="#5A3A5A" opacity="0.8"/>
      <path d="M -15 -25 Q -18 -15 -12 -5" stroke="#2A1A2A" stroke-width="1.5" fill="none" opacity="0.7"/>
      <path d="M 15 -25 Q 18 -15 12 -5" stroke="#2A1A2A" stroke-width="1.5" fill="none" opacity="0.7"/>
    </g>
    
    <!-- Calla 2 -->
    <g transform="translate(28, -80)">
      <path d="M 0 0 Q -11 -7 -14 -23 Q -9 -32 0 -35 Q 9 -32 14 -23 Q 11 -7 0 0 Z" 
            fill="url(#callaGradient)" opacity="0.95"/>
      <ellipse cx="0" cy="-18" rx="3" ry="8" fill="#5A3A5A" opacity="0.8"/>
      <path d="M -14 -23 Q -16 -14 -11 -5" stroke="#2A1A2A" stroke-width="1.5" fill="none" opacity="0.7"/>
    </g>
    
    <!-- Orchidées pourpres -->
    <!-- Orchidée 1 (gauche, grande) -->
    <g transform="translate(-55, -95)">
      <ellipse cx="0" cy="-15" rx="10" ry="18" fill="#9A6AA8" opacity="0.95"/>
      <ellipse cx="-12" cy="0" rx="14" ry="10" fill="#9A6AA8" opacity="0.95"/>
      <ellipse cx="12" cy="0" rx="14" ry="10" fill="#9A6AA8" opacity="0.95"/>
      <ellipse cx="-8" cy="10" rx="12" ry="9" fill="#8A5A98" opacity="0.95"/>
      <ellipse cx="8" cy="10" rx="12" ry="9" fill="#8A5A98" opacity="0.95"/>
      <!-- Centre de l'orchidée (labelle) -->
      <ellipse cx="0" cy="5" rx="6" ry="10" fill="#AA7AB8" opacity="0.95"/>
      <circle cx="0" cy="3" r="3" fill="#BA8AC8"/>
      <path d="M -2 3 Q 0 6 2 3" stroke="#5A2A68" stroke-width="1" fill="none"/>
    </g>
    
    <!-- Orchidée 2 (centre, la plus grande) -->
    <g transform="translate(0, -110)">
      <ellipse cx="0" cy="-18" rx="12" ry="20" fill="#9A6AA8" opacity="0.95"/>
      <ellipse cx="-14" cy="0" rx="16" ry="12" fill="#9A6AA8" opacity="0.95"/>
      <ellipse cx="14" cy="0" rx="16" ry="12" fill="#9A6AA8" opacity="0.95"/>
      <ellipse cx="-10" cy="12" rx="14" ry="10" fill="#8A5A98" opacity="0.95"/>
      <ellipse cx="10" cy="12" rx="14" ry="10" fill="#8A5A98" opacity="0.95"/>
      <ellipse cx="0" cy="6" rx="7" ry="12" fill="#AA7AB8" opacity="0.95"/>
      <circle cx="0" cy="4" r="4" fill="#BA8AC8"/>
      <path d="M -2.5 4 Q 0 8 2.5 4" stroke="#5A2A68" stroke-width="1.2" fill="none"/>
    </g>
    
    <!-- Orchidée 3 (droite) -->
    <g transform="translate(52, -90)">
      <ellipse cx="0" cy="-16" rx="10" ry="19" fill="#9A6AA8" opacity="0.95"/>
      <ellipse cx="-13" cy="0" rx="15" ry="11" fill="#9A6AA8" opacity="0.95"/>
      <ellipse cx="13" cy="0" rx="15" ry="11" fill="#9A6AA8" opacity="0.95"/>
      <ellipse cx="-9" cy="11" rx="13" ry="9" fill="#8A5A98" opacity="0.95"/>
      <ellipse cx="9" cy="11" rx="13" ry="9" fill="#8A5A98" opacity="0.95"/>
      <ellipse cx="0" cy="5" rx="6.5" ry="11" fill="#AA7AB8" opacity="0.95"/>
      <circle cx="0" cy="3" r="3.5" fill="#BA8AC8"/>
      <path d="M -2 3 Q 0 7 2 3" stroke="#5A2A68" stroke-width="1" fill="none"/>
    </g>
    
    <!-- Petites orchidées d'accent -->
    <g transform="translate(-25, -60)">
      <ellipse cx="0" cy="-10" rx="7" ry="12" fill="#8A5A98" opacity="0.9"/>
      <ellipse cx="-8" cy="0" rx="10" ry="7" fill="#8A5A98" opacity="0.9"/>
      <ellipse cx="8" cy="0" rx="10" ry="7" fill="#8A5A98" opacity="0.9"/>
      <ellipse cx="0" cy="3" rx="4" ry="6" fill="#9A6AA8" opacity="0.9"/>
    </g>
    
    <!-- Feuillage sombre avec reflets -->
    <ellipse cx="-65" cy="-50" rx="10" ry="20" fill="#3A4A3A" opacity="0.7" transform="rotate(-25 -65 -50)"/>
    <ellipse cx="62" cy="-45" rx="11" ry="21" fill="#3A4A3A" opacity="0.7" transform="rotate(25 62 -45)"/>
    <ellipse cx="-40" cy="-35" rx="9" ry="18" fill="#4A5A4A" opacity="0.65" transform="rotate(-15 -40 -35)"/>
    <ellipse cx="38" cy="-38" rx="9" ry="19" fill="#4A5A4A" opacity="0.65" transform="rotate(15 38 -38)"/>
  </g>
  
  <!-- Éléments décoratifs dorés luxueux -->
  <circle cx="180" cy="150" r="3" fill="#9A7A5A" opacity="0.3"/>
  <circle cx="620" cy="430" r="4" fill="#AA8A6A" opacity="0.25"/>
  <line x1="200" y1="480" x2="205" y2="490" stroke="#8A6A4A" stroke-width="1.5" opacity="0.2"/>
  <ellipse cx="600" cy="180" rx="5" ry="8" fill="#7A5A3A" opacity="0.2" transform="rotate(30 600 180)"/>
</svg>
