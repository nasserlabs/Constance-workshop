<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Pattern floral subtil pour le fond -->
  <defs>
    <pattern id="floralPattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Petite fleur 1 -->
      <circle cx="20" cy="20" r="3" fill="#8FA08E" opacity="0.05"/>
      <ellipse cx="20" cy="15" rx="1.5" ry="3" fill="#8FA08E" opacity="0.05"/>
      <ellipse cx="20" cy="25" rx="1.5" ry="3" fill="#8FA08E" opacity="0.05"/>
      <ellipse cx="15" cy="20" rx="3" ry="1.5" fill="#8FA08E" opacity="0.05"/>
      <ellipse cx="25" cy="20" rx="3" ry="1.5" fill="#8FA08E" opacity="0.05"/>
      
      <!-- Feuille décorative 1 -->
      <path d="M35 15 Q45 20 35 25 Q30 20 35 15" fill="#E8DCC4" opacity="0.03"/>
      
      <!-- Petite fleur 2 -->
      <circle cx="70" cy="70" r="2.5" fill="#E8C5C0" opacity="0.05"/>
      <ellipse cx="70" cy="66" rx="1.2" ry="2.5" fill="#E8C5C0" opacity="0.05"/>
      <ellipse cx="70" cy="74" rx="1.2" ry="2.5" fill="#E8C5C0" opacity="0.05"/>
      <ellipse cx="66" cy="70" rx="2.5" ry="1.2" fill="#E8C5C0" opacity="0.05"/>
      <ellipse cx="74" cy="70" rx="2.5" ry="1.2" fill="#E8C5C0" opacity="0.05"/>
      
      <!-- Feuille décorative 2 -->
      <path d="M85 65 Q90 70 85 75 Q82 70 85 65" fill="#8FA08E" opacity="0.03"/>
      
      <!-- Petits points décoratifs -->
      <circle cx="50" cy="50" r="1" fill="#5A6C57" opacity="0.03"/>
      <circle cx="10" cy="80" r="1" fill="#5A6C57" opacity="0.03"/>
      <circle cx="90" cy="30" r="1" fill="#5A6C57" opacity="0.03"/>
      
      <!-- Brindilles subtiles -->
      <line x1="40" y1="40" x2="45" y2="38" stroke="#8FA08E" stroke-width="0.5" opacity="0.05"/>
      <line x1="45" y1="38" x2="48" y2="42" stroke="#8FA08E" stroke-width="0.5" opacity="0.05"/>
      
      <line x1="60" y1="85" x2="63" y2="88" stroke="#8FA08E" stroke-width="0.5" opacity="0.05"/>
      <line x1="63" y1="88" x2="58" y2="90" stroke="#8FA08E" stroke-width="0.5" opacity="0.05"/>
    </pattern>
  </defs>
  
  <!-- Application du pattern -->
  <rect width="400" height="400" fill="url(#floralPattern)"/>
</svg>
