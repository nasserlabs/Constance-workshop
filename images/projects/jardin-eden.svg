<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond dégradé naturel -->
  <defs>
    <linearGradient id="edenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F0E8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D8E8D8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8DCC8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#E8F4F8;stop-opacity:0.5" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="600" fill="url(#edenGradient)"/>
  
  <!-- Cercles décoratifs -->
  <circle cx="100" cy="120" r="70" fill="#7A9B7A" opacity="0.08"/>
  <circle cx="700" cy="500" r="90" fill="#7A9B7A" opacity="0.06"/>
  
  <!-- Terrarium (cloche en verre) -->
  <g transform="translate(400, 300)">
    <!-- Base du terrarium -->
    <ellipse cx="0" cy="100" rx="90" ry="15" fill="#8B7355" opacity="0.8"/>
    <rect x="-90" y="95" width="180" height="10" fill="#6B5345"/>
    
    <!-- Terre et substrat -->
    <ellipse cx="0" cy="95" rx="85" ry="12" fill="#5A4332"/>
    <ellipse cx="0" cy="85" rx="80" ry="10" fill="#6B5345" opacity="0.7"/>
    
    <!-- Cloche en verre -->
    <path d="M -85 90 Q -85 -80 0 -120 Q 85 -80 85 90 Z" 
          fill="url(#glassGradient)" 
          stroke="#B8D8E8" 
          stroke-width="2" 
          opacity="0.6"/>
    
    <!-- Reflet sur le verre -->
    <path d="M -60 -80 Q -50 -100 -30 -110" 
          stroke="#FFFFFF" 
          stroke-width="3" 
          opacity="0.4" 
          fill="none"/>
    
    <!-- Mousse -->
    <ellipse cx="-40" cy="80" rx="25" ry="8" fill="#6B8B6B" opacity="0.8"/>
    <ellipse cx="30" cy="80" rx="20" ry="7" fill="#7A9B7A" opacity="0.8"/>
    <ellipse cx="-10" cy="75" rx="18" ry="6" fill="#6B8B6B" opacity="0.8"/>
    
    <!-- Petites pierres -->
    <circle cx="50" cy="85" r="4" fill="#A8A8A8"/>
    <circle cx="55" cy="88" r="3" fill="#989898"/>
    <circle cx="-50" cy="88" r="3.5" fill="#A8A8A8"/>
    
    <!-- Fougères -->
    <!-- Fougère gauche -->
    <g transform="translate(-35, 40)">
      <path d="M 0 0 Q -5 -15 -8 -30" stroke="#5A6C57" stroke-width="2" fill="none"/>
      <ellipse cx="-5" cy="-10" rx="8" ry="3" fill="#6B8B6B" opacity="0.9" transform="rotate(-30 -5 -10)"/>
      <ellipse cx="-6" cy="-18" rx="7" ry="2.5" fill="#6B8B6B" opacity="0.9" transform="rotate(-35 -6 -18)"/>
      <ellipse cx="-7" cy="-25" rx="6" ry="2" fill="#6B8B6B" opacity="0.9" transform="rotate(-40 -7 -25)"/>
    </g>
    
    <!-- Fougère droite -->
    <g transform="translate(30, 35)">
      <path d="M 0 0 Q 5 -18 7 -35" stroke="#5A6C57" stroke-width="2" fill="none"/>
      <ellipse cx="4" cy="-12" rx="9" ry="3" fill="#7A9B7A" opacity="0.9" transform="rotate(30 4 -12)"/>
      <ellipse cx="5" cy="-20" rx="8" ry="2.5" fill="#7A9B7A" opacity="0.9" transform="rotate(35 5 -20)"/>
      <ellipse cx="6" cy="-28" rx="7" ry="2" fill="#7A9B7A" opacity="0.9" transform="rotate(40 6 -28)"/>
    </g>
    
    <!-- Plantes grasses -->
    <!-- Plante grasse 1 -->
    <g transform="translate(-15, 55)">
      <ellipse cx="0" cy="0" rx="8" ry="12" fill="#8FA08E" opacity="0.9"/>
      <ellipse cx="-6" cy="-3" rx="6" ry="9" fill="#8FA08E" opacity="0.85"/>
      <ellipse cx="6" cy="-3" rx="6" ry="9" fill="#8FA08E" opacity="0.85"/>
      <ellipse cx="0" cy="-8" rx="5" ry="7" fill="#9FB09E" opacity="0.9"/>
    </g>
    
    <!-- Plante grasse 2 -->
    <g transform="translate(10, 60)">
      <circle cx="0" cy="0" r="10" fill="#7A9B7A" opacity="0.9"/>
      <circle cx="-7" cy="-2" r="7" fill="#7A9B7A" opacity="0.85"/>
      <circle cx="7" cy="-2" r="7" fill="#7A9B7A" opacity="0.85"/>
      <circle cx="0" cy="-8" r="6" fill="#8AAA8A" opacity="0.9"/>
    </g>
    
    <!-- Petite plante centrale -->
    <g transform="translate(0, 50)">
      <rect x="-1" y="-20" width="2" height="20" fill="#5A6C57"/>
      <ellipse cx="0" cy="-22" rx="5" ry="8" fill="#6B8B6B" opacity="0.9"/>
      <ellipse cx="-4" cy="-18" rx="4" ry="6" fill="#6B8B6B" opacity="0.85"/>
      <ellipse cx="4" cy="-18" rx="4" ry="6" fill="#6B8B6B" opacity="0.85"/>
    </g>
  </g>
  
  <!-- Petits détails décoratifs -->
  <circle cx="180" cy="200" r="3" fill="#7A9B7A" opacity="0.3"/>
  <circle cx="620" cy="350" r="4" fill="#7A9B7A" opacity="0.25"/>
</svg>
