<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond dégradé doux -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F1E8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8DCC4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8C5C0;stop-opacity:0.8" />
    </linearGradient>
    
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8FA08E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5A6C57;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fond -->
  <rect width="800" height="600" fill="url(#bgGradient)"/>
  
  <!-- Cercle décoratif arrière-plan -->
  <circle cx="150" cy="120" r="80" fill="#8FA08E" opacity="0.1"/>
  <circle cx="650" cy="480" r="100" fill="#E8C5C0" opacity="0.15"/>
  <circle cx="700" cy="150" r="60" fill="#8FA08E" opacity="0.08"/>
  
  <!-- Composition florale centrale -->
  <g transform="translate(400, 300)">
    <!-- Vase stylisé -->
    <path d="M-60 50 Q-65 80 -50 120 L50 120 Q65 80 60 50 Z" fill="#E8DCC4" opacity="0.8"/>
    <ellipse cx="0" cy="50" rx="65" ry="15" fill="#8FA08E" opacity="0.3"/>
    
    <!-- Tiges -->
    <line x1="-30" y1="50" x2="-40" y2="-80" stroke="#5A6C57" stroke-width="4" opacity="0.6"/>
    <line x1="0" y1="50" x2="0" y2="-100" stroke="#5A6C57" stroke-width="5" opacity="0.6"/>
    <line x1="30" y1="50" x2="35" y2="-70" stroke="#5A6C57" stroke-width="4" opacity="0.6"/>
    
    <!-- Feuilles -->
    <ellipse cx="-35" cy="-40" rx="15" ry="30" fill="url(#leafGradient)" opacity="0.7" transform="rotate(-30 -35 -40)"/>
    <ellipse cx="40" cy="-30" rx="12" ry="25" fill="url(#leafGradient)" opacity="0.7" transform="rotate(25 40 -30)"/>
    <ellipse cx="-10" cy="-60" rx="18" ry="35" fill="url(#leafGradient)" opacity="0.7" transform="rotate(-10 -10 -60)"/>
    
    <!-- Fleurs -->
    <!-- Fleur 1 -->
    <g transform="translate(-40, -80)">
      <circle r="20" fill="#E8C5C0" opacity="0.8"/>
      <ellipse cx="0" cy="-12" rx="8" ry="15" fill="#E8C5C0"/>
      <ellipse cx="0" cy="12" rx="8" ry="15" fill="#E8C5C0"/>
      <ellipse cx="-12" cy="0" rx="15" ry="8" fill="#E8C5C0"/>
      <ellipse cx="12" cy="0" rx="15" ry="8" fill="#E8C5C0"/>
      <circle r="8" fill="#F5F1E8"/>
    </g>
    
    <!-- Fleur 2 (centrale, plus grande) -->
    <g transform="translate(0, -100)">
      <circle r="25" fill="#F5F1E8" opacity="0.9"/>
      <ellipse cx="0" cy="-15" rx="10" ry="18" fill="#F5F1E8"/>
      <ellipse cx="0" cy="15" rx="10" ry="18" fill="#F5F1E8"/>
      <ellipse cx="-15" cy="0" rx="18" ry="10" fill="#F5F1E8"/>
      <ellipse cx="15" cy="0" rx="18" ry="10" fill="#F5F1E8"/>
      <circle r="10" fill="#8FA08E"/>
    </g>
    
    <!-- Fleur 3 -->
    <g transform="translate(35, -70)">
      <circle r="18" fill="#E8C5C0" opacity="0.8"/>
      <ellipse cx="0" cy="-10" rx="7" ry="13" fill="#E8C5C0"/>
      <ellipse cx="0" cy="10" rx="7" ry="13" fill="#E8C5C0"/>
      <ellipse cx="-10" cy="0" rx="13" ry="7" fill="#E8C5C0"/>
      <ellipse cx="10" cy="0" rx="13" ry="7" fill="#E8C5C0"/>
      <circle r="6" fill="#F5F1E8"/>
    </g>
  </g>
  
  <!-- Éléments décoratifs -->
  <!-- Feuilles volantes -->
  <ellipse cx="100" cy="200" rx="20" ry="40" fill="#8FA08E" opacity="0.2" transform="rotate(-45 100 200)"/>
  <ellipse cx="680" cy="350" rx="25" ry="45" fill="#8FA08E" opacity="0.15" transform="rotate(30 680 350)"/>
  
  <!-- Petits points décoratifs -->
  <circle cx="200" cy="450" r="5" fill="#E8C5C0" opacity="0.3"/>
  <circle cx="600" cy="100" r="4" fill="#8FA08E" opacity="0.3"/>
  <circle cx="150" cy="500" r="6" fill="#E8C5C0" opacity="0.25"/>
  
  <!-- Texte décoratif (optionnel) -->
  <text x="400" y="550" font-family="serif" font-size="24" fill="#5A6C57" opacity="0.3" text-anchor="middle" font-style="italic">
    L'Atelier de Constance
  </text>
</svg>
