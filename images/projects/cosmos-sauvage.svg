<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond dégradé naturel et libre -->
  <defs>
    <linearGradient id="wildGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8FBF5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#EEF5E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E5F0DD;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="600" fill="url(#wildGradient)"/>
  
  <!-- Cercles décoratifs -->
  <circle cx="110" cy="95" r="60" fill="#A8B89F" opacity="0.08"/>
  <circle cx="690" cy="515" r="80" fill="#C8D8A8" opacity="0.1"/>
  
  <!-- Composition sauvage et libre -->
  <g transform="translate(400, 330)">
    <!-- Herbes folles (tiges variées et désordonnées) -->
    <line x1="-65" y1="20" x2="-75" y2="-95" stroke="#8B9B7A" stroke-width="2" opacity="0.5"/>
    <line x1="-50" y1="22" x2="-58" y2="-100" stroke="#9BAB8A" stroke-width="1.8" opacity="0.5"/>
    <line x1="-35" y1="24" x2="-42" y2="-88" stroke="#8B9B7A" stroke-width="2.2" opacity="0.5"/>
    <line x1="-20" y1="25" x2="-25" y2="-92" stroke="#9BAB8A" stroke-width="1.9" opacity="0.5"/>
    <line x1="-5" y1="26" x2="-8" y2="-85" stroke="#8B9B7A" stroke-width="2.1" opacity="0.5"/>
    <line x1="10" y1="26" x2="12" y2="-90" stroke="#9BAB8A" stroke-width="2" opacity="0.5"/>
    <line x1="25" y1="25" x2="28" y2="-87" stroke="#8B9B7A" stroke-width="2.2" opacity="0.5"/>
    <line x1="40" y1="24" x2="45" y2="-93" stroke="#9BAB8A" stroke-width="1.8" opacity="0.5"/>
    <line x1="55" y1="22" x2="62" y2="-96" stroke="#8B9B7A" stroke-width="2" opacity="0.5"/>
    <line x1="70" y1="20" x2="78" y2="-89" stroke="#9BAB8A" stroke-width="2.1" opacity="0.5"/>
    
    <!-- Épis d'herbe (sommets) -->
    <ellipse cx="-75" cy="-97" rx="2" ry="5" fill="#A8B89F" opacity="0.7"/>
    <ellipse cx="-58" cy="-102" rx="2.2" ry="5.5" fill="#A8B89F" opacity="0.7"/>
    <ellipse cx="-42" cy="-90" rx="2" ry="5" fill="#A8B89F" opacity="0.7"/>
    <ellipse cx="12" cy="-92" rx="2.1" ry="5.2" fill="#A8B89F" opacity="0.7"/>
    <ellipse cx="45" cy="-95" rx="2" ry="5" fill="#A8B89F" opacity="0.7"/>
    <ellipse cx="62" cy="-98" rx="2.2" ry="5.5" fill="#A8B89F" opacity="0.7"/>
    <ellipse cx="78" cy="-91" rx="2" ry="5" fill="#A8B89F" opacity="0.7"/>
    
    <!-- Fleurs des champs variées -->
    <!-- Marguerites sauvages -->
    <g transform="translate(-55, -75)">
      <circle r="12" fill="#FFFEF8"/>
      <ellipse cx="0" cy="-8" rx="3" ry="8" fill="#FFFFFF"/>
      <ellipse cx="7" cy="-4" rx="3" ry="8" fill="#FFFFFF" transform="rotate(60 7 -4)"/>
      <ellipse cx="7" cy="4" rx="3" ry="8" fill="#FFFFFF" transform="rotate(120 7 4)"/>
      <ellipse cx="0" cy="8" rx="3" ry="8" fill="#FFFFFF" transform="rotate(180 0 8)"/>
      <ellipse cx="-7" cy="4" rx="3" ry="8" fill="#FFFFFF" transform="rotate(-120 -7 4)"/>
      <ellipse cx="-7" cy="-4" rx="3" ry="8" fill="#FFFFFF" transform="rotate(-60 -7 -4)"/>
      <circle r="4" fill="#F8E870"/>
    </g>
    
    <g transform="translate(48, -82)">
      <circle r="11" fill="#FFFEF8"/>
      <ellipse cx="0" cy="-7" rx="2.8" ry="7.5" fill="#FFFFFF"/>
      <ellipse cx="6" cy="-3.5" rx="2.8" ry="7.5" fill="#FFFFFF" transform="rotate(60 6 -3.5)"/>
      <ellipse cx="6" cy="3.5" rx="2.8" ry="7.5" fill="#FFFFFF" transform="rotate(120 6 3.5)"/>
      <ellipse cx="0" cy="7" rx="2.8" ry="7.5" fill="#FFFFFF" transform="rotate(180 0 7)"/>
      <ellipse cx="-6" cy="3.5" rx="2.8" ry="7.5" fill="#FFFFFF" transform="rotate(-120 -6 3.5)"/>
      <ellipse cx="-6" cy="-3.5" rx="2.8" ry="7.5" fill="#FFFFFF" transform="rotate(-60 -6 -3.5)"/>
      <circle r="3.5" fill="#F8E870"/>
    </g>
    
    <!-- Coquelicots (rouges/roses) -->
    <g transform="translate(-30, -65)">
      <circle r="10" fill="#F8A8A8" opacity="0.8"/>
      <ellipse cx="0" cy="-6" rx="5" ry="8" fill="#F88888" opacity="0.9"/>
      <ellipse cx="5" cy="3" rx="5" ry="8" fill="#F88888" opacity="0.9" transform="rotate(100 5 3)"/>
      <ellipse cx="-5" cy="3" rx="5" ry="8" fill="#F88888" opacity="0.9" transform="rotate(-100 -5 3)"/>
      <circle r="3" fill="#3A3A3A" opacity="0.7"/>
    </g>
    
    <g transform="translate(20, -60)">
      <circle r="9" fill="#F8A8A8" opacity="0.8"/>
      <ellipse cx="0" cy="-5" rx="4.5" ry="7" fill="#F88888" opacity="0.9"/>
      <ellipse cx="4.5" cy="2.5" rx="4.5" ry="7" fill="#F88888" opacity="0.9" transform="rotate(100 4.5 2.5)"/>
      <ellipse cx="-4.5" cy="2.5" rx="4.5" ry="7" fill="#F88888" opacity="0.9" transform="rotate(-100 -4.5 2.5)"/>
      <circle r="2.5" fill="#3A3A3A" opacity="0.7"/>
    </g>
    
    <!-- Bleuets -->
    <g transform="translate(-8, -78)">
      <circle r="8" fill="#A8C8E8" opacity="0.8"/>
      <ellipse cx="0" cy="-5" rx="2.5" ry="6" fill="#88B8E8" opacity="0.9"/>
      <ellipse cx="4" cy="-2.5" rx="2.5" ry="6" fill="#88B8E8" opacity="0.9" transform="rotate(60 4 -2.5)"/>
      <ellipse cx="4" cy="2.5" rx="2.5" ry="6" fill="#88B8E8" opacity="0.9" transform="rotate(120 4 2.5)"/>
      <ellipse cx="0" cy="5" rx="2.5" ry="6" fill="#88B8E8" opacity="0.9" transform="rotate(180 0 5)"/>
      <ellipse cx="-4" cy="2.5" rx="2.5" ry="6" fill="#88B8E8" opacity="0.9" transform="rotate(-120 -4 2.5)"/>
      <ellipse cx="-4" cy="-2.5" rx="2.5" ry="6" fill="#88B8E8" opacity="0.9" transform="rotate(-60 -4 -2.5)"/>
      <circle r="2" fill="#5A8AC8"/>
    </g>
    
    <!-- Boutons d'or (jaunes) -->
    <circle cx="35" cy="-70" r="5" fill="#F8D870" opacity="0.85"/>
    <circle cx="38" cy="-68" r="4" fill="#F8E888" opacity="0.85"/>
    <circle cx="-40" cy="-55" r="4.5" fill="#F8D870" opacity="0.85"/>
    <circle cx="-42" cy="-53" r="3.5" fill="#F8E888" opacity="0.85"/>
    
    <!-- Trèfles et petites fleurs -->
    <circle cx="5" cy="-50" r="3" fill="#E8C8D8" opacity="0.8"/>
    <circle cx="-15" cy="-45" r="3.5" fill="#D8B8E8" opacity="0.8"/>
    <circle cx="58" cy="-55" r="3" fill="#F8C8A8" opacity="0.8"/>
    <circle cx="-62" cy="-60" r="3.2" fill="#C8D8F8" opacity="0.8"/>
    
    <!-- Graminées légères -->
    <path d="M -80 -70 Q -82 -80 -80 -85" stroke="#A8B89F" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M 75 -65 Q 78 -73 76 -78" stroke="#A8B89F" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M -68 -85 Q -70 -92 -68 -96" stroke="#A8B89F" stroke-width="1.3" fill="none" opacity="0.6"/>
    <path d="M 65 -75 Q 67 -82 65 -86" stroke="#A8B89F" stroke-width="1.3" fill="none" opacity="0.6"/>
    
    <!-- Brindilles -->
    <line x1="-85" y1="-50" x2="-90" y2="-65" stroke="#9BAB8A" stroke-width="1.5" opacity="0.4"/>
    <line x1="-90" y1="-65" x2="-88" y2="-72" stroke="#9BAB8A" stroke-width="1.2" opacity="0.4"/>
    <line x1="82" y1="-48" x2="88" y2="-60" stroke="#9BAB8A" stroke-width="1.5" opacity="0.4"/>
  </g>
  
  <!-- Éléments décoratifs légers -->
  <circle cx="170" cy="200" r="3" fill="#A8B89F" opacity="0.2"/>
  <circle cx="630" cy="350" r="3.5" fill="#C8D8A8" opacity="0.18"/>
  <ellipse cx="220" cy="480" rx="4" ry="6" fill="#9BAB8A" opacity="0.15" transform="rotate(-35 220 480)"/>
</svg>
