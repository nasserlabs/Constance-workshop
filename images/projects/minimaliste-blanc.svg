<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond minimaliste blanc cassé -->
  <defs>
    <linearGradient id="minimalistGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FEFEFE;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F8F8F8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F0F0;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="lilyGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#F8F8F8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ECECEC;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <rect width="800" height="600" fill="url(#minimalistGradient)"/>
  
  <!-- Composition centrale minimaliste -->
  <g transform="translate(400, 320)">
    <!-- Tiges épurées -->
    <line x1="-15" y1="30" x2="-15" y2="-110" stroke="#B8C5C0" stroke-width="3" opacity="0.6"/>
    <line x1="15" y1="30" x2="15" y2="-105" stroke="#B8C5C0" stroke-width="3" opacity="0.6"/>
    <line x1="0" y1="32" x2="0" y2="-95" stroke="#B8C5C0" stroke-width="3.5" opacity="0.6"/>
    
    <!-- Eucalyptus argenté (feuillage léger et espacé) -->
    <ellipse cx="-25" cy="-70" rx="8" ry="16" fill="#C5D3D0" opacity="0.7" transform="rotate(-20 -25 -70)"/>
    <ellipse cx="-28" cy="-85" rx="7" ry="14" fill="#C5D3D0" opacity="0.65" transform="rotate(-15 -28 -85)"/>
    <ellipse cx="25" cy="-65" rx="8" ry="15" fill="#D0D8D5" opacity="0.7" transform="rotate(20 25 -65)"/>
    <ellipse cx="28" cy="-80" rx="7" ry="14" fill="#D0D8D5" opacity="0.65" transform="rotate(15 28 -80)"/>
    <ellipse cx="-20" cy="-50" rx="7" ry="13" fill="#C5D3D0" opacity="0.65" transform="rotate(-12 -20 -50)"/>
    <ellipse cx="20" cy="-48" rx="7" ry="13" fill="#D0D8D5" opacity="0.65" transform="rotate(12 20 -48)"/>
    
    <!-- Lys blancs (formes élégantes et épurées) -->
    <!-- Lys 1 (gauche) -->
    <g transform="translate(-15, -110)">
      <!-- Pétales du lys (6 pétales allongés) -->
      <ellipse cx="0" cy="-20" rx="6" ry="24" fill="url(#lilyGradient)" opacity="0.95"/>
      <ellipse cx="-17" cy="-10" rx="6" ry="24" fill="url(#lilyGradient)" opacity="0.95" transform="rotate(-60 -17 -10)"/>
      <ellipse cx="17" cy="-10" rx="6" ry="24" fill="url(#lilyGradient)" opacity="0.95" transform="rotate(60 17 -10)"/>
      <ellipse cx="-17" cy="10" rx="6" ry="24" fill="url(#lilyGradient)" opacity="0.9" transform="rotate(-120 -17 10)"/>
      <ellipse cx="17" cy="10" rx="6" ry="24" fill="url(#lilyGradient)" opacity="0.9" transform="rotate(120 17 10)"/>
      <ellipse cx="0" cy="20" rx="6" ry="24" fill="url(#lilyGradient)" opacity="0.9" transform="rotate(180 0 20)"/>
      <!-- Centre du lys (étamines) -->
      <line x1="0" y1="-8" x2="0" y2="-18" stroke="#E8D8A0" stroke-width="1.5"/>
      <line x1="-3" y1="-8" x2="-3" y2="-16" stroke="#E8D8A0" stroke-width="1.5"/>
      <line x1="3" y1="-8" x2="3" y2="-16" stroke="#E8D8A0" stroke-width="1.5"/>
      <circle cx="0" cy="-18" r="1.5" fill="#D4C080"/>
      <circle cx="-3" cy="-16" r="1.5" fill="#D4C080"/>
      <circle cx="3" cy="-16" r="1.5" fill="#D4C080"/>
    </g>
    
    <!-- Lys 2 (droite) -->
    <g transform="translate(15, -105)">
      <ellipse cx="0" cy="-20" rx="6" ry="24" fill="url(#lilyGradient)" opacity="0.95"/>
      <ellipse cx="-17" cy="-10" rx="6" ry="24" fill="url(#lilyGradient)" opacity="0.95" transform="rotate(-60 -17 -10)"/>
      <ellipse cx="17" cy="-10" rx="6" ry="24" fill="url(#lilyGradient)" opacity="0.95" transform="rotate(60 17 -10)"/>
      <ellipse cx="-17" cy="10" rx="6" ry="24" fill="url(#lilyGradient)" opacity="0.9" transform="rotate(-120 -17 10)"/>
      <ellipse cx="17" cy="10" rx="6" ry="24" fill="url(#lilyGradient)" opacity="0.9" transform="rotate(120 17 10)"/>
      <ellipse cx="0" cy="20" rx="6" ry="24" fill="url(#lilyGradient)" opacity="0.9" transform="rotate(180 0 20)"/>
      <line x1="0" y1="-8" x2="0" y2="-18" stroke="#E8D8A0" stroke-width="1.5"/>
      <line x1="-3" y1="-8" x2="-3" y2="-16" stroke="#E8D8A0" stroke-width="1.5"/>
      <line x1="3" y1="-8" x2="3" y2="-16" stroke="#E8D8A0" stroke-width="1.5"/>
      <circle cx="0" cy="-18" r="1.5" fill="#D4C080"/>
      <circle cx="-3" cy="-16" r="1.5" fill="#D4C080"/>
      <circle cx="3" cy="-16" r="1.5" fill="#D4C080"/>
    </g>
    
    <!-- Lys 3 (centre, légèrement plus bas) -->
    <g transform="translate(0, -95)">
      <ellipse cx="0" cy="-18" rx="5.5" ry="22" fill="url(#lilyGradient)" opacity="0.95"/>
      <ellipse cx="-16" cy="-9" rx="5.5" ry="22" fill="url(#lilyGradient)" opacity="0.95" transform="rotate(-60 -16 -9)"/>
      <ellipse cx="16" cy="-9" rx="5.5" ry="22" fill="url(#lilyGradient)" opacity="0.95" transform="rotate(60 16 -9)"/>
      <ellipse cx="-16" cy="9" rx="5.5" ry="22" fill="url(#lilyGradient)" opacity="0.9" transform="rotate(-120 -16 9)"/>
      <ellipse cx="16" cy="9" rx="5.5" ry="22" fill="url(#lilyGradient)" opacity="0.9" transform="rotate(120 16 9)"/>
      <ellipse cx="0" cy="18" rx="5.5" ry="22" fill="url(#lilyGradient)" opacity="0.9" transform="rotate(180 0 18)"/>
      <line x1="0" y1="-7" x2="0" y2="-16" stroke="#E8D8A0" stroke-width="1.5"/>
      <line x1="-2.5" y1="-7" x2="-2.5" y2="-14" stroke="#E8D8A0" stroke-width="1.5"/>
      <line x1="2.5" y1="-7" x2="2.5" y2="-14" stroke="#E8D8A0" stroke-width="1.5"/>
      <circle cx="0" cy="-16" r="1.5" fill="#D4C080"/>
      <circle cx="-2.5" cy="-14" r="1.5" fill="#D4C080"/>
      <circle cx="2.5" cy="-14" r="1.5" fill="#D4C080"/>
    </g>
    
    <!-- Eucalyptus supplémentaire (accent minimaliste) -->
    <ellipse cx="-35" cy="-35" rx="6" ry="12" fill="#C5D3D0" opacity="0.6" transform="rotate(-25 -35 -35)"/>
    <ellipse cx="35" cy="-32" rx="6" ry="11" fill="#D0D8D5" opacity="0.6" transform="rotate(25 35 -32)"/>
  </g>
  
  <!-- Éléments décoratifs ultra-subtils -->
  <circle cx="180" cy="150" r="2" fill="#C5D3D0" opacity="0.15"/>
  <circle cx="620" cy="420" r="2.5" fill="#C5D3D0" opacity="0.12"/>
  <line x1="150" y1="500" x2="155" y2="490" stroke="#E0E0E0" stroke-width="1" opacity="0.2"/>
  <line x1="650" y1="140" x2="645" y2="135" stroke="#E0E0E0" stroke-width="1" opacity="0.2"/>
</svg>
