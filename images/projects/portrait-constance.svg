<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond doux pour portrait -->
  <defs>
    <linearGradient id="portraitGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8F5F2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F0E8E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8DCC4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="600" fill="url(#portraitGradient)"/>
  
  <!-- Cercles décoratifs doux -->
  <circle cx="130" cy="110" r="70" fill="#E8C5C0" opacity="0.12"/>
  <circle cx="670" cy="490" r="90" fill="#8FA08E" opacity="0.1"/>
  
  <!-- Silhouette artistique centrale -->
  <g transform="translate(400, 300)">
    <!-- Silhouette stylisée de Constance -->
    <ellipse cx="0" cy="-20" rx="80" ry="110" fill="#D8C8B8" opacity="0.3"/>
    
    <!-- Cheveux stylisés -->
    <ellipse cx="-25" cy="-80" rx="55" ry="65" fill="#A89080" opacity="0.5"/>
    <ellipse cx="25" cy="-80" rx="55" ry="65" fill="#A89080" opacity="0.5"/>
    <ellipse cx="0" cy="-90" rx="50" ry="55" fill="#B8A090" opacity="0.5"/>
    
    <!-- Visage -->
    <ellipse cx="0" cy="-50" rx="35" ry="45" fill="#E8D8C8" opacity="0.6"/>
    
    <!-- Épaules et haut -->
    <ellipse cx="0" cy="15" rx="65" ry="40" fill="#C8B8A8" opacity="0.4"/>
    
    <!-- Mains tenant des fleurs (stylisé) -->
    <ellipse cx="-45" cy="30" rx="15" ry="25" fill="#E8D8C8" opacity="0.5" transform="rotate(-20 -45 30)"/>
    <ellipse cx="45" cy="30" rx="15" ry="25" fill="#E8D8C8" opacity="0.5" transform="rotate(20 45 30)"/>
  </g>
  
  <!-- Bouquet tenu devant (accent floral) -->
  <g transform="translate(400, 380)">
    <!-- Roses délicates -->
    <circle cx="-20" cy="0" r="18" fill="#E8C5C0" opacity="0.7"/>
    <circle cx="20" cy="0" r="16" fill="#E8C5C0" opacity="0.7"/>
    <circle cx="0" cy="-15" r="20" fill="#F5D5DD" opacity="0.7"/>
    <circle cx="-10" cy="15" r="15" fill="#E8C5C0" opacity="0.65"/>
    <circle cx="12" cy="18" r="14" fill="#F5D5DD" opacity="0.65"/>
    
    <!-- Feuillage -->
    <ellipse cx="-35" cy="5" rx="12" ry="20" fill="#8FA08E" opacity="0.6" transform="rotate(-25 -35 5)"/>
    <ellipse cx="35" cy="8" rx="12" ry="22" fill="#8FA08E" opacity="0.6" transform="rotate(25 35 8)"/>
    <ellipse cx="-25" cy="-10" rx="10" ry="18" fill="#9FB09E" opacity="0.6" transform="rotate(-15 -25 -10)"/>
    <ellipse cx="25" cy="-8" rx="10" ry="18" fill="#9FB09E" opacity="0.6" transform="rotate(15 25 -8)"/>
  </g>
  
  <!-- Éléments décoratifs floraux autour -->
  <g opacity="0.4">
    <!-- Coin supérieur gauche -->
    <circle cx="120" cy="100" r="12" fill="#E8C5C0"/>
    <circle cx="140" cy="90" r="10" fill="#F5D5DD"/>
    <circle cx="105" cy="120" r="9" fill="#E8C5C0"/>
    <ellipse cx="150" cy="110" rx="8" ry="15" fill="#8FA08E" transform="rotate(30 150 110)"/>
    
    <!-- Coin supérieur droit -->
    <circle cx="680" cy="95" r="11" fill="#E8C5C0"/>
    <circle cx="665" cy="110" r="9" fill="#F5D5DD"/>
    <ellipse cx="695" cy="105" rx="8" ry="14" fill="#8FA08E" transform="rotate(-30 695 105)"/>
    
    <!-- Coin inférieur gauche -->
    <circle cx="130" cy="510" r="10" fill="#E8C5C0"/>
    <circle cx="115" cy="495" r="8" fill="#F5D5DD"/>
    <ellipse cx="145" cy="500" rx="7" ry="13" fill="#8FA08E" transform="rotate(25 145 500)"/>
    
    <!-- Coin inférieur droit -->
    <circle cx="670" cy="500" r="13" fill="#E8C5C0"/>
    <circle cx="690" cy="490" r="11" fill="#F5D5DD"/>
    <circle cx="655" cy="485" r="9" fill="#E8C5C0"/>
    <ellipse cx="680" cy="515" rx="9" ry="16" fill="#8FA08E" transform="rotate(-25 680 515)"/>
  </g>
  
  <!-- Petits détails poétiques -->
  <circle cx="250" cy="200" r="4" fill="#E8C5C0" opacity="0.3"/>
  <circle cx="550" cy="350" r="5" fill="#8FA08E" opacity="0.25"/>
  <circle cx="320" cy="450" r="3" fill="#F5D5DD" opacity="0.3"/>
  <circle cx="480" cy="180" r="4" fill="#8FA08E" opacity="0.25"/>
</svg>
