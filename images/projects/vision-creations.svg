<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond dégradé inspirant -->
  <defs>
    <linearGradient id="visionGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDF9F5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F5EDE3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EDE0D0;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="creationGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#F5F1E8;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <rect width="800" height="600" fill="url(#visionGradient)"/>
  
  <!-- Cercle lumineux central (représente l'inspiration) -->
  <circle cx="400" cy="300" r="180" fill="url(#creationGlow)"/>
  
  <!-- Mains créatrices stylisées (symbolique) -->
  <g transform="translate(400, 320)">
    <!-- Main gauche -->
    <g transform="translate(-120, -20)">
      <ellipse cx="0" cy="0" rx="35" ry="50" fill="#E8D8C8" opacity="0.5" transform="rotate(-20 0 0)"/>
      <ellipse cx="-8" cy="-15" rx="8" ry="25" fill="#E8D8C8" opacity="0.5" transform="rotate(-30 -8 -15)"/>
      <ellipse cx="8" cy="-12" rx="8" ry="22" fill="#E8D8C8" opacity="0.5" transform="rotate(-10 8 -12)"/>
    </g>
    
    <!-- Main droite -->
    <g transform="translate(120, -20)">
      <ellipse cx="0" cy="0" rx="35" ry="50" fill="#E8D8C8" opacity="0.5" transform="rotate(20 0 0)"/>
      <ellipse cx="-8" cy="-12" rx="8" ry="22" fill="#E8D8C8" opacity="0.5" transform="rotate(10 -8 -12)"/>
      <ellipse cx="8" cy="-15" rx="8" ry="25" fill="#E8D8C8" opacity="0.5" transform="rotate(30 8 -15)"/>
    </g>
    
    <!-- Création florale émergeant entre les mains -->
    <g transform="translate(0, -60)">
      <!-- Tiges centrales -->
      <line x1="-25" y1="40" x2="-30" y2="-50" stroke="#8FA08E" stroke-width="3.5" opacity="0.7"/>
      <line x1="0" y1="42" x2="0" y2="-65" stroke="#8FA08E" stroke-width="4" opacity="0.7"/>
      <line x1="25" y1="40" x2="28" y2="-48" stroke="#8FA08E" stroke-width="3.5" opacity="0.7"/>
      
      <!-- Feuillage -->
      <ellipse cx="-35" cy="-20" rx="12" ry="22" fill="#8FA08E" opacity="0.6" transform="rotate(-25 -35 -20)"/>
      <ellipse cx="35" cy="-18" rx="12" ry="20" fill="#9FB09E" opacity="0.6" transform="rotate(25 35 -18)"/>
      <ellipse cx="-20" cy="-35" rx="10" ry="18" fill="#8FA08E" opacity="0.6" transform="rotate(-15 -20 -35)"/>
      <ellipse cx="20" cy="-33" rx="10" ry="18" fill="#9FB09E" opacity="0.6" transform="rotate(15 20 -33)"/>
      
      <!-- Fleurs principales -->
      <!-- Fleur 1 (gauche) -->
      <g transform="translate(-30, -50)">
        <circle r="20" fill="#E8C5C0" opacity="0.8"/>
        <ellipse cx="0" cy="-12" rx="8" ry="15" fill="#F5D5DD" opacity="0.85"/>
        <ellipse cx="-10" cy="6" rx="8" ry="15" fill="#F5D5DD" opacity="0.85" transform="rotate(-120 -10 6)"/>
        <ellipse cx="10" cy="6" rx="8" ry="15" fill="#F5D5DD" opacity="0.85" transform="rotate(120 10 6)"/>
        <circle r="12" fill="#E8C5C0" opacity="0.9"/>
        <circle r="6" fill="#D8B5B0"/>
      </g>
      
      <!-- Fleur 2 (centre, la plus lumineuse) -->
      <g transform="translate(0, -65)">
        <circle r="24" fill="#FFFFFF" opacity="0.7"/>
        <circle r="22" fill="#F5F1E8" opacity="0.8"/>
        <ellipse cx="0" cy="-14" rx="9" ry="17" fill="#FFFFFF" opacity="0.9"/>
        <ellipse cx="-12" cy="7" rx="9" ry="17" fill="#FFFFFF" opacity="0.9" transform="rotate(-120 -12 7)"/>
        <ellipse cx="12" cy="7" rx="9" ry="17" fill="#FFFFFF" opacity="0.9" transform="rotate(120 12 7)"/>
        <circle r="14" fill="#F5F1E8" opacity="0.95"/>
        <circle r="7" fill="#E8DCC4"/>
      </g>
      
      <!-- Fleur 3 (droite) -->
      <g transform="translate(28, -48)">
        <circle r="18" fill="#E8C5C0" opacity="0.8"/>
        <ellipse cx="0" cy="-11" rx="7" ry="14" fill="#F5D5DD" opacity="0.85"/>
        <ellipse cx="-9" cy="5" rx="7" ry="14" fill="#F5D5DD" opacity="0.85" transform="rotate(-120 -9 5)"/>
        <ellipse cx="9" cy="5" rx="7" ry="14" fill="#F5D5DD" opacity="0.85" transform="rotate(120 9 5)"/>
        <circle r="11" fill="#E8C5C0" opacity="0.9"/>
        <circle r="5" fill="#D8B5B0"/>
      </g>
      
      <!-- Petites fleurs d'accompagnement -->
      <circle cx="-15" cy="-25" r="8" fill="#F5D5DD" opacity="0.75"/>
      <circle cx="15" cy="-28" r="7" fill="#F5D5DD" opacity="0.75"/>
      <circle cx="-40" cy="-10" r="6" fill="#E8C5C0" opacity="0.7"/>
      <circle cx="38" cy="-8" r="6" fill="#E8C5C0" opacity="0.7"/>
    </g>
  </g>
  
  <!-- Éléments inspirants flottants (représentent les idées) -->
  <g opacity="0.4">
    <!-- Particules créatives autour -->
    <circle cx="180" cy="150" r="5" fill="#E8C5C0"/>
    <circle cx="160" cy="180" r="4" fill="#F5D5DD"/>
    <circle cx="200" cy="170" r="6" fill="#E8C5C0"/>
    
    <circle cx="620" cy="140" r="6" fill="#E8C5C0"/>
    <circle cx="640" cy="165" r="5" fill="#F5D5DD"/>
    <circle cx="600" cy="160" r="4" fill="#E8C5C0"/>
    
    <circle cx="170" cy="430" r="5" fill="#E8C5C0"/>
    <circle cx="195" cy="450" r="4" fill="#F5D5DD"/>
    
    <circle cx="630" cy="440" r="6" fill="#E8C5C0"/>
    <circle cx="610" cy="460" r="5" fill="#F5D5DD"/>
    
    <!-- Petites feuilles flottantes -->
    <ellipse cx="220" cy="200" rx="6" ry="12" fill="#8FA08E" transform="rotate(-35 220 200)"/>
    <ellipse cx="580" cy="190" rx="6" ry="11" fill="#8FA08E" transform="rotate(30 580 190)"/>
    <ellipse cx="210" cy="410" rx="5" ry="10" fill="#8FA08E" transform="rotate(-40 210 410)"/>
    <ellipse cx="590" cy="420" rx="6" ry="12" fill="#8FA08E" transform="rotate(35 590 420)"/>
  </g>
  
  <!-- Rayons de lumière douce (symbolisent l'inspiration) -->
  <g opacity="0.15">
    <line x1="400" y1="250" x2="250" y2="120" stroke="#F5F1E8" stroke-width="2"/>
    <line x1="400" y1="250" x2="550" y2="120" stroke="#F5F1E8" stroke-width="2"/>
    <line x1="400" y1="250" x2="200" y2="480" stroke="#F5F1E8" stroke-width="2"/>
    <line x1="400" y1="250" x2="600" y2="480" stroke="#F5F1E8" stroke-width="2"/>
  </g>
  
  <!-- Cercles concentriques de créativité -->
  <circle cx="400" cy="300" r="200" stroke="#E8DCC4" stroke-width="1" fill="none" opacity="0.3"/>
  <circle cx="400" cy="300" r="230" stroke="#E8DCC4" stroke-width="0.8" fill="none" opacity="0.2"/>
  <circle cx="400" cy="300" r="260" stroke="#E8DCC4" stroke-width="0.6" fill="none" opacity="0.15"/>
  
  <!-- Particules lumineuses subtiles -->
  <circle cx="320" cy="250" r="2" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="480" cy="280" r="2.5" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="360" cy="350" r="2" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="440" cy="330" r="2" fill="#FFFFFF" opacity="0.5"/>
</svg>
